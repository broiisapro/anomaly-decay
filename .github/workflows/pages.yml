name: pages

# Publishes the report rendered from the committed results to GitHub Pages.
# Runs on a published release (the report for that tag) or manually; never on push or PRs.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.26"
          enable-cache: false
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"
      - uses: actions/configure-pages@v6
      - run: uv sync --frozen
      - name: Render the report from committed results
        run: make report
      - uses: actions/upload-pages-artifact@v5
        with:
          path: report/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
