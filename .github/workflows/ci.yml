name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run mypy anomaly_decay

  tests:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run pytest -q

  reproduce-fixture:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: false
      - run: uv sync --frozen
      - name: Quarto availability
        run: |
          if ! command -v quarto >/dev/null 2>&1; then
            echo "::error::Quarto is not installed on this runner; install it with 'brew install --cask quarto'"
            exit 1
          fi
          quarto --version
          uv run quarto check jupyter
      - run: make reproduce-fixture
