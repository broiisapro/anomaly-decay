# Pinned data sources for anomaly-decay.
# OSAP release vintages: https://www.openassetpricing.com/ (pinned per release below).
# Ken French files are revised monthly; `make refresh-french` is the only path that re-downloads
# and updates the hashes and download date below.

[osap]
vintage = 202510
portfolios = ["op", "deciles_ew", "deciles_vw"]
# Phase 2 vintage comparison: earlier releases in the pre-registered preference order
# (config/phase2_preregistration.yaml, `vintages.compare_preference`). Fetched with
# `python -m anomaly_decay.data.fetch --osap --vintage N` (signal doc + op only).
compare_vintages = [202410, 202408, 2023]
raw_dir = "data/raw"

[french]
ff5_url = "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_5_Factors_2x3_CSV.zip"
umd_url = "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Momentum_Factor_CSV.zip"
pinned_dir = "data/pinned"
downloaded_on = "2026-10-16"
