# Original-paper reference values for the report.
#
# Entered by the project maintainer after reading the published article.
# Source: McLean and Pontiff (2016), Journal of Finance 71(1), Table I ("Mean portfolio return
# in-sample 0.582") and Table II column (1). Table II standard errors are FGLS estimates that allow
# contemporaneous cross-correlation of portfolio residuals, not clustered standard errors.
# The published table marks the post-sample coefficient *** although -0.150 / 0.077 is a
# t-statistic of about -1.95; the value is reproduced as printed.

citation:
  authors: "McLean, R. David, and Jeffrey Pontiff"
  year: 2016
  title: "Does Academic Research Destroy Stock Return Predictability?"
  journal: "Journal of Finance"
  volume: 71
  issue: 1
  pages: "5-32"
  doi: "10.1111/jofi.12365"

status: verified

table1:
  in_sample_mean_pct: 0.582

table2_col1:
  status: verified
  se_method: "FGLS, contemporaneous cross-sectional correlation"
  n_predictors: 97
  n_obs: 51851
  post_sample:
    coef: -0.150
    se: 0.077
  post_publication:
    coef: -0.337
    se: 0.090

headline:
  post_sample_decline_pct: 26
  post_publication_decline_pct: 58

table2_col4:
  status: verified
  description: "Post-sample and post-publication dummies interacted with the predictor's in-sample t-statistic"
  n_predictors: 97
  n_obs: 51944
  post_sample:
    coef: 0.067
    se: 0.112
  post_publication:
    coef: -0.120
    se: 0.114
  post_sample_x_tstat:
    coef: -0.061
    se: 0.023
  post_publication_x_tstat:
    coef: -0.063
    se: 0.018
