name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.26"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.26"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run mypy anomaly_decay

  tests:
    runs-on: ubuntu-latest
    env:
      # The freeze tag exists; a checkout without it (or a drifted frozen file) must fail.
      ANOMALY_DECAY_REQUIRE_FREEZE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.26"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run pytest -q

  reproduce-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.26"
          enable-cache: false
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"
      - run: quarto --version
      - run: uv sync --frozen
      - run: make reproduce-fixture
