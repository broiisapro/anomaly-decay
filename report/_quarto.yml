project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - companion.qmd
    - memo.qmd

website:
  title: "anomaly-decay"
  description: "Post-sample and post-publication decay of anomaly returns"
  site-url: https://broiisapro.github.io/anomaly-decay/
  navbar:
    left:
      - text: Report
        href: index.html
      - text: Explore a predictor
        href: companion.html
      - text: RA memo (PDF)
        href: memo.pdf
    right:
      - format-links
      - icon: github
        href: https://github.com/broiisapro/anomaly-decay
  page-footer:
    left: >-
      anomaly-decay — a replication of McLean & Pontiff (2016) on
      Chen–Zimmermann Open Source Asset Pricing portfolios.

engine: jupyter

execute:
  echo: false
  warning: false

# The project renders every document to HTML plus Typst PDF; the pages that need only
# one of the two override this in their own front matter (`companion.qmd`: HTML,
# `memo.qmd`: Typst). `index.qmd` keeps both formats.
format:
  html:
    toc: true
    embed-resources: false
  typst: default
